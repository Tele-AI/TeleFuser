<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax H3 quantization memory and generation cost</title>
  <desc id="desc">Bars compare peak allocated memory in gigabytes. A red line compares end-to-end generation seconds per step.</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#101828">MiniMax H3 Online Quantization</text>
  <text x="500" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475467">Matched H100 benchmark: 768p, 5 seconds, 50 steps, seed 0</text>

  <g stroke="#eaecf0" stroke-width="1">
    <line x1="100" y1="430" x2="900" y2="430"/>
    <line x1="100" y1="342.5" x2="900" y2="342.5"/>
    <line x1="100" y1="255" x2="900" y2="255"/>
    <line x1="100" y1="167.5" x2="900" y2="167.5"/>
    <line x1="100" y1="80" x2="900" y2="80"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667085" text-anchor="end">
    <text x="90" y="434">0</text><text x="90" y="346">20</text><text x="90" y="259">40</text><text x="90" y="172">60</text><text x="90" y="84">80</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667085" text-anchor="start">
    <text x="910" y="434">6.5</text><text x="910" y="346">7.0</text><text x="910" y="259">7.5</text><text x="910" y="172">8.0</text><text x="910" y="84">8.5</text>
  </g>
  <line x1="100" y1="80" x2="100" y2="430" stroke="#344054" stroke-width="1.5"/>
  <line x1="900" y1="80" x2="900" y2="430" stroke="#344054" stroke-width="1.5"/>
  <line x1="100" y1="430" x2="900" y2="430" stroke="#344054" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="145" y="116" width="110" height="314" rx="3" fill="#667085"/>
    <rect x="425" y="240" width="110" height="190" rx="3" fill="#1570ef"/>
    <rect x="705" y="331" width="110" height="99" rx="3" fill="#12b76a"/>
    <text x="200" y="106" fill="#344054">71.7 GB</text><text x="480" y="230" fill="#344054">43.5 GB</text><text x="760" y="321" fill="#344054">22.6 GB</text>
    <text x="200" y="458" fill="#344054">BF16</text><text x="480" y="458" fill="#344054">TorchAO FP8</text><text x="760" y="458" fill="#344054">BNB NF4</text>
  </g>

  <polyline points="200,145 480,302 760,244" fill="none" stroke="#d92d20" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#d92d20" stroke="#ffffff" stroke-width="2">
    <circle cx="200" cy="145" r="7"/><circle cx="480" cy="302" r="7"/><circle cx="760" cy="244" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#b42318" text-anchor="middle">
    <text x="200" y="132">8.13 s/step</text><text x="480" y="289">7.23 s/step</text><text x="760" y="231">7.56 s/step</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#475467">
    <rect x="130" y="493" width="16" height="16" fill="#667085"/><text x="153" y="506">Peak allocated memory (GB)</text>
    <line x1="425" y1="501" x2="450" y2="501" stroke="#d92d20" stroke-width="4"/><circle cx="438" cy="501" r="5" fill="#d92d20"/><text x="458" y="506">Generation time (s/step; lower is better)</text>
  </g>
  <text x="500" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#667085">Left axis: memory. Right axis: end-to-end generation time divided by 50 steps.</text>
</svg>
